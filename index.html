<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Pixel-level image studio with Material 3 rotary knobs and stackable vertical sliders."
    />
    <title>Movements — Pixel Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d1b20;
        background: #fef7ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;

        /* Material 3 Baseline Color Tokens */
        --md-sys-color-primary: #6750a4;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #eaddff;
        --md-sys-color-on-primary-container: #21005d;
        --md-sys-color-secondary-container: #e8def8;
        --md-sys-color-on-secondary-container: #1d192b;
        --md-sys-color-surface: #fef7ff;
        --md-sys-color-on-surface: #1d1b20;
        --md-sys-color-surface-variant: #e7e0ec;
        --md-sys-color-on-surface-variant: #49454f;
        --md-sys-color-outline: #79747e;
        --md-sys-color-outline-variant: #cac4d0;

        /* Material 3 Elevations */
        --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
        --md-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
        --md-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.3);

        /* Motion Tokens */
        --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
        --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
        --md-sys-motion-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
        --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
        --md-sys-motion-spring-fast-spatial: linear(
          0, 0.15199 10%, 0.41201 20%, 0.6383 30%, 0.79724 40%,
          0.89588 50%, 0.9516 60%, 0.98044 70%, 0.99397 80%, 0.99953 90%, 1.0013 100%
        );
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fef7ff;
        padding: 20px;
        overflow-x: hidden;
      }

      /* Main Frame Container */
      .studio-frame {
        display: flex;
        gap: 36px;
        align-items: center;
        justify-content: center;
        max-width: 1024px;
        width: 100%;
        user-select: none;
      }

      /* Left Pill Container */
      .left-pill {
        width: 190px;
        height: 606px;
        border-radius: 95px;
        background: var(--md-sys-color-primary-container);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 34px 0;
        flex-shrink: 0;
        box-shadow: var(--md-elevation-1);
      }

      /* Material 3 Rotary Knob Component */
      .knob-control {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: none;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Knob Dial Body */
      .knob-dial {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: var(--md-elevation-1);
        overflow: hidden;
        transition:
          box-shadow 150ms var(--md-sys-motion-easing-standard),
          transform 150ms var(--md-sys-motion-spring-fast-spatial);
      }

      .knob-control:hover .knob-dial {
        box-shadow: var(--md-elevation-2);
      }

      .knob-control.is-dragging .knob-dial {
        box-shadow: var(--md-elevation-3);
      }

      .knob-control:focus-visible .knob-dial {
        outline: 3px solid var(--md-sys-color-on-primary-container);
        outline-offset: 3px;
      }

      /* Hover/Pressed State Layer */
      .knob-dial::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms linear;
        z-index: 3;
      }

      .knob-control:hover .knob-dial::before {
        opacity: 0.08;
      }

      .knob-control:active .knob-dial::before {
        opacity: 0.14;
      }

      /* Rotating Indicator Ring */
      .knob-indicator-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        will-change: transform;
        z-index: 1;
        transition: transform 60ms ease-out;
      }

      /* Indicator Pip / Notch */
      .knob-indicator {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 14px;
        border-radius: 3px;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }

      /* Knob Upright Center Face */
      .knob-center-face {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        text-align: center;
      }

      .knob-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        color: var(--md-sys-color-on-primary);
      }

      .knob-value {
        font-size: 14px;
        font-weight: 700;
        margin-top: 4px;
        color: var(--md-sys-color-on-primary);
        font-variant-numeric: tabular-nums;
      }

      .knob-icon {
        width: 18px;
        height: 18px;
        margin-top: 4px;
        color: var(--md-sys-color-on-primary);
        opacity: 0.9;
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      /* Right Main Container */
      .right-container {
        width: 700px;
        height: 606px;
        border-radius: 48px;
        background: var(--md-sys-color-primary-container);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 60px 38px;
        position: relative;
        flex-shrink: 0;
        box-shadow: var(--md-elevation-1);
      }

      /* White Image Screen Box */
      .screen-box {
        width: 580px;
        height: 408px;
        border-radius: 32px;
        background: #ffffff;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(103, 80, 164, 0.08);
        transition: outline 150ms ease, background-color 150ms ease;
      }

      .screen-box.drag-over {
        background-color: #faf5fd;
        outline: 3px dashed var(--md-sys-color-primary);
        outline-offset: -8px;
      }

      /* Canvas filling 100% of the white box with crisp high-DPI rendering */
      .pixel-canvas {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        border-radius: 32px;
        image-rendering: auto;
      }

      /* Save Badge Overlay on Hover */
      .screen-save-badge {
        position: absolute;
        bottom: 16px;
        right: 16px;
        background: rgba(33, 0, 93, 0.85);
        color: #ffffff;
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        opacity: 0;
        transform: translateY(4px);
        pointer-events: none;
        transition:
          opacity 160ms var(--md-sys-motion-easing-standard),
          transform 160ms var(--md-sys-motion-easing-standard);
      }

      .screen-save-badge svg {
        width: 14px;
        height: 14px;
      }

      .screen-box:hover .screen-save-badge {
        opacity: 1;
        transform: translateY(0);
      }

      /* Sliders Row Below White Box */
      .sliders-row {
        width: 580px;
        height: 96px;
        margin-top: 14px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        position: relative;
      }

      /* Individual Vertical Slider Column */
      .v-slider-col {
        width: 48px;
        height: 96px;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        touch-action: none;
        cursor: ns-resize;
        outline: none;
      }

      /* Vertical Track Slot */
      .v-slider-track {
        position: absolute;
        bottom: 22px;
        width: 8px;
        height: 58px;
        border-radius: 4px;
        background: rgba(103, 80, 164, 0.14);
        pointer-events: none;
        transition: background-color 150ms ease;
      }

      .v-slider-col:hover .v-slider-track,
      .v-slider-col.is-active .v-slider-track,
      .v-slider-col.has-value .v-slider-track {
        background: rgba(103, 80, 164, 0.28);
      }

      .v-slider-fill {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 0%;
        border-radius: 4px;
        background: var(--md-sys-color-primary);
        pointer-events: none;
      }

      /* Slider Dot Handle (40px Circle) */
      .slider-dot {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        box-shadow: var(--md-elevation-1);
        transition:
          transform 100ms var(--md-sys-motion-easing-standard),
          box-shadow 150ms var(--md-sys-motion-easing-standard);
        z-index: 2;
        -webkit-tap-highlight-color: transparent;
      }

      .v-slider-col:hover .slider-dot {
        box-shadow: var(--md-elevation-2);
      }

      .v-slider-col.is-active .slider-dot {
        cursor: grabbing;
        transform: translateX(-50%) scale(1.1);
        box-shadow: var(--md-elevation-3);
      }

      .v-slider-col:focus-visible .slider-dot {
        outline: 3px solid var(--md-sys-color-on-primary-container);
        outline-offset: 2px;
      }

      /* Dot State Layer */
      .slider-dot::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms linear;
      }

      .v-slider-col:hover .slider-dot::before {
        opacity: 0.1;
      }

      /* Floating Value Tooltip */
      .slider-tooltip {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%) translateY(4px);
        background: var(--md-sys-color-on-primary-container);
        color: var(--md-sys-color-on-primary);
        font-size: 11px;
        font-weight: 500;
        padding: 5px 9px;
        border-radius: 8px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        box-shadow: 0 4px 12px rgba(33, 0, 93, 0.28);
        transition:
          opacity 140ms var(--md-sys-motion-easing-standard),
          transform 140ms var(--md-sys-motion-easing-standard);
        z-index: 10;
      }

      .v-slider-col:hover .slider-tooltip,
      .v-slider-col.is-active .slider-tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Bottom Indicator Label */
      .slider-col-label {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--md-sys-color-primary);
        opacity: 0.75;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 140ms ease;
      }

      .v-slider-col:hover .slider-col-label,
      .v-slider-col.is-active .slider-col-label {
        opacity: 1;
      }

      /* Ripple Ink Effect */
      .ripple-ink {
        position: absolute;
        border-radius: 50%;
        background-color: currentColor;
        opacity: 0.2;
        pointer-events: none;
        transform: scale(0);
        animation: m3-ripple 420ms var(--md-sys-motion-easing-standard) forwards;
      }

      @keyframes m3-ripple {
        to {
          transform: scale(2.6);
          opacity: 0;
        }
      }

      /* Responsive Layout */
      @media (max-width: 980px) {
        .studio-frame {
          flex-direction: column;
          align-items: center;
        }

        .left-pill {
          width: 580px;
          height: 180px;
          border-radius: 90px;
          flex-direction: row;
          padding: 0 36px;
        }

        .right-container {
          width: 100%;
          max-width: 680px;
          height: auto;
          padding: 30px 24px;
        }

        .screen-box {
          width: 100%;
          height: 380px;
        }

        .sliders-row {
          width: 100%;
        }
      }

      @media (max-width: 600px) {
        .left-pill {
          width: 100%;
          height: auto;
          border-radius: 36px;
          padding: 20px;
          gap: 12px;
        }

        .knob-control,
        .knob-dial {
          width: 88px;
          height: 88px;
        }

        .knob-title {
          font-size: 9px;
        }

        .screen-box {
          height: 280px;
        }
      }

      /* Accessibility Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="studio-frame">
      <!-- Left Pill Container with Rotary Knobs -->
      <aside class="left-pill" aria-label="Rotary Controls">
        <!-- Knob 1: UPLOAD -->
        <div
          class="knob-control"
          id="upload-knob"
          role="button"
          tabindex="0"
          aria-label="Upload an image. Drag vertically or scroll to cycle sample presets."
          title="Click to upload an image. Drag vertically to cycle presets."
        >
          <div class="knob-dial" id="upload-dial">
            <div class="knob-indicator-ring" id="upload-ring">
              <div class="knob-indicator"></div>
            </div>
            <div class="knob-center-face">
              <span class="knob-title">UPLOAD</span>
              <svg class="knob-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M11 16V7.85l-2.6 2.6L7 9l5-5 5 5-1.4 1.45-2.6-2.6V16h2ZM5 20q-.825 0-1.412-.587T3 18v-3h2v3h14v-3h2v3q0 .825-.587 1.413T19 20H5Z" />
              </svg>
            </div>
          </div>
        </div>
        <input class="file-input" id="image-input" type="file" accept="image/*" aria-label="Choose image file" />

        <!-- Knob 2: INTENSITY -->
        <div
          class="knob-control"
          id="intensity-knob"
          role="slider"
          tabindex="0"
          aria-label="Master Intensity"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="100"
          title="Drag vertically or scroll to adjust master intensity"
        >
          <div class="knob-dial" id="intensity-dial">
            <div class="knob-indicator-ring" id="intensity-ring">
              <div class="knob-indicator"></div>
            </div>
            <div class="knob-center-face">
              <span class="knob-title">INTENSITY</span>
              <span class="knob-value" id="intensity-value">100%</span>
            </div>
          </div>
        </div>

        <!-- Knob 3: RESET -->
        <div
          class="knob-control"
          id="reset-knob"
          role="button"
          tabindex="0"
          aria-label="Reset all effect sliders"
          title="Click or turn to reset all effect sliders to zero"
        >
          <div class="knob-dial" id="reset-dial">
            <div class="knob-indicator-ring" id="reset-ring">
              <div class="knob-indicator"></div>
            </div>
            <div class="knob-center-face">
              <span class="knob-title">RESET</span>
              <svg class="knob-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 13c0-4.42-3.58-8-8-8zm-6 8c0-1.01.25-1.97.7-2.8L5.24 8.74A7.93 7.93 0 0 0 4 13c0 4.42 3.58 8 8 8v4l5-5-5-5v4c-3.31 0-6-2.69-6-6z" />
              </svg>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right Main Container -->
      <section class="right-container" aria-label="Image screen and effect sliders">
        <!-- White Display Box (fills 100% with high-DPI image) -->
        <div class="screen-box" id="screen-box" title="Click to download processed image, or drop an image file here">
          <canvas class="pixel-canvas" id="pixel-canvas" role="img" aria-label="Pixel manipulated image"></canvas>
          <div class="screen-save-badge">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M5 20h14v-2H5v2zm7-18L5.33 8.67l1.42 1.41L11 5.83V16h2V5.83l4.24 4.25 1.42-1.41L12 2z" transform="rotate(180 12 12)" />
            </svg>
            <span>Click to save PNG</span>
          </div>
        </div>

        <!-- 8 Interactive Vertical Sliders (The dots below the white box) -->
        <div class="sliders-row" id="sliders-row" aria-label="Effect sliders">
          <!-- Slider 1: Pixelate -->
          <div class="v-slider-col" data-effect="pixelate" data-name="Pixelate" role="slider" aria-label="Pixelate" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Pixelate: 0%</div>
            </div>
            <span class="slider-col-label">Pixel</span>
          </div>

          <!-- Slider 2: Film Grain -->
          <div class="v-slider-col" data-effect="grain" data-name="Film Grain" role="slider" aria-label="Film Grain" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Grain: 0%</div>
            </div>
            <span class="slider-col-label">Grain</span>
          </div>

          <!-- Slider 3: Sharpen -->
          <div class="v-slider-col" data-effect="sharpen" data-name="Sharpen" role="slider" aria-label="Sharpen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Sharpen: 0%</div>
            </div>
            <span class="slider-col-label">Sharp</span>
          </div>

          <!-- Slider 4: Posterize -->
          <div class="v-slider-col" data-effect="posterize" data-name="Posterize" role="slider" aria-label="Posterize" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Posterize: 0%</div>
            </div>
            <span class="slider-col-label">Poster</span>
          </div>

          <!-- Slider 5: Sepia Warmth -->
          <div class="v-slider-col" data-effect="sepia" data-name="Sepia" role="slider" aria-label="Sepia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Sepia: 0%</div>
            </div>
            <span class="slider-col-label">Sepia</span>
          </div>

          <!-- Slider 6: Contrast / Threshold -->
          <div class="v-slider-col" data-effect="contrast" data-name="Contrast" role="slider" aria-label="Contrast" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Contrast: 0%</div>
            </div>
            <span class="slider-col-label">Contrast</span>
          </div>

          <!-- Slider 7: Vignette -->
          <div class="v-slider-col" data-effect="vignette" data-name="Vignette" role="slider" aria-label="Vignette" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Vignette: 0%</div>
            </div>
            <span class="slider-col-label">Vignette</span>
          </div>

          <!-- Slider 8: Invert -->
          <div class="v-slider-col" data-effect="invert" data-name="Invert" role="slider" aria-label="Invert" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
            <div class="v-slider-track">
              <div class="v-slider-fill"></div>
            </div>
            <div class="slider-dot">
              <div class="slider-tooltip">Invert: 0%</div>
            </div>
            <span class="slider-col-label">Invert</span>
          </div>
        </div>
      </section>
    </main>

    <script>
      // DOM Elements
      const uploadKnob = document.querySelector("#upload-knob");
      const uploadRing = document.querySelector("#upload-ring");
      const imageInput = document.querySelector("#image-input");
      const intensityKnob = document.querySelector("#intensity-knob");
      const intensityRing = document.querySelector("#intensity-ring");
      const intensityValue = document.querySelector("#intensity-value");
      const resetKnob = document.querySelector("#reset-knob");
      const resetRing = document.querySelector("#reset-ring");
      const screenBox = document.querySelector("#screen-box");
      const pixelCanvas = document.querySelector("#pixel-canvas");
      const sliderCols = document.querySelectorAll(".v-slider-col");

      const canvasCtx = pixelCanvas.getContext("2d", { willReadFrequently: true });
      const sampleImagePath = "Assets/sample_landscape.png";

      // Fixed Display Dimensions & High DPI
      const displayW = 580;
      const displayH = 408;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const canvasW = Math.round(displayW * dpr);
      const canvasH = Math.round(displayH * dpr);

      pixelCanvas.width = canvasW;
      pixelCanvas.height = canvasH;

      // State
      let sourceImage = null;
      let rawImageData = null;
      let masterIntensity = 1.0;
      let loadedUrl = null;
      const maxTravel = 56; // Max upward slider travel in px
      let isRendering = false;

      const effectValues = {
        pixelate: 0,
        grain: 0,
        sharpen: 0,
        posterize: 0,
        sepia: 0,
        contrast: 0,
        vignette: 0,
        invert: 0,
      };

      // Built-in presets for Upload Knob rotation
      const presetList = [
        "Assets/sample_landscape.png",
        "Assets/Movements%20Fri%2023%20Oct.png"
      ];
      let presetIndex = 0;

      // Material Ink Ripple
      function attachRipple(el) {
        el.addEventListener("pointerdown", (event) => {
          const rect = el.getBoundingClientRect();
          const ripple = document.createElement("span");
          ripple.className = "ripple-ink";
          const size = Math.max(rect.width, rect.height) * 1.5;
          ripple.style.width = `${size}px`;
          ripple.style.height = `${size}px`;
          ripple.style.left = `${event.clientX - rect.left - size / 2}px`;
          ripple.style.top = `${event.clientY - rect.top - size / 2}px`;
          el.appendChild(ripple);

          const cleanup = () => {
            ripple.remove();
            window.removeEventListener("pointerup", cleanup);
            window.removeEventListener("pointercancel", cleanup);
          };
          window.addEventListener("pointerup", cleanup);
          window.addEventListener("pointercancel", cleanup);
        });
      }

      document.querySelectorAll(".knob-control, .slider-dot").forEach(attachRipple);

      // Fast math clamps
      function clamp(val) {
        return val < 0 ? 0 : val > 255 ? 255 : val;
      }

      // Real-time High Performance Pixel Stack Processing
      function applyPixelStack() {
        if (!sourceImage || !rawImageData || isRendering) return;

        isRendering = true;
        requestAnimationFrame(() => {
          const w = canvasW;
          const h = canvasH;
          const src = rawImageData.data;
          const outputImg = canvasCtx.createImageData(w, h);
          const out = outputImg.data;
          out.set(src);

          const eff = effectValues;
          const master = masterIntensity;

          // 1. Pixelate (Block Aggregation)
          if (eff.pixelate > 0.01) {
            const blockSize = Math.max(2, Math.round(1 + eff.pixelate * 28 * dpr));
            for (let y = 0; y < h; y += blockSize) {
              for (let x = 0; x < w; x += blockSize) {
                const bw = Math.min(blockSize, w - x);
                const bh = Math.min(blockSize, h - y);
                let rSum = 0, gSum = 0, bSum = 0, aSum = 0;
                const count = bw * bh;

                for (let by = 0; by < bh; by++) {
                  for (let bx = 0; bx < bw; bx++) {
                    const idx = ((y + by) * w + (x + bx)) * 4;
                    rSum += out[idx];
                    gSum += out[idx + 1];
                    bSum += out[idx + 2];
                    aSum += out[idx + 3];
                  }
                }

                const rA = rSum / count;
                const gA = gSum / count;
                const bA = bSum / count;
                const aA = aSum / count;

                for (let by = 0; by < bh; by++) {
                  for (let bx = 0; bx < bw; bx++) {
                    const idx = ((y + by) * w + (x + bx)) * 4;
                    out[idx] = rA;
                    out[idx + 1] = gA;
                    out[idx + 2] = bA;
                    out[idx + 3] = aA;
                  }
                }
              }
            }
          }

          // 2. Sharpen (Convolution Kernel)
          if (eff.sharpen > 0.01) {
            const copy = new Uint8ClampedArray(out);
            const k = eff.sharpen * 1.6;
            const centerW = 1 + 4 * k;
            for (let y = 1; y < h - 1; y++) {
              const rowIdx = y * w;
              const topIdx = (y - 1) * w;
              const botIdx = (y + 1) * w;
              for (let x = 1; x < w - 1; x++) {
                const idx = (rowIdx + x) * 4;
                const top = (topIdx + x) * 4;
                const bot = (botIdx + x) * 4;
                const left = (rowIdx + (x - 1)) * 4;
                const right = (rowIdx + (x + 1)) * 4;

                for (let c = 0; c < 3; c++) {
                  const val = centerW * copy[idx + c] - k * (copy[top + c] + copy[bot + c] + copy[left + c] + copy[right + c]);
                  out[idx + c] = clamp(val);
                }
              }
            }
          }

          // 3. Film Grain
          if (eff.grain > 0.01) {
            const amount = eff.grain * 60;
            let seed = 12345;
            for (let i = 0; i < out.length; i += 4) {
              seed = (seed * 1664525 + 1013904223) | 0;
              const noise = ((seed & 0xff) / 127.5 - 1.0) * amount;
              out[i] = clamp(out[i] + noise);
              out[i + 1] = clamp(out[i + 1] + noise);
              out[i + 2] = clamp(out[i + 2] + noise);
            }
          }

          // 4. Posterize
          if (eff.posterize > 0.01) {
            const levels = Math.max(2, Math.round(16 - eff.posterize * 13));
            const step = 255 / (levels - 1);
            for (let i = 0; i < out.length; i += 4) {
              out[i] = Math.round(out[i] / step) * step;
              out[i + 1] = Math.round(out[i + 1] / step) * step;
              out[i + 2] = Math.round(out[i + 2] / step) * step;
            }
          }

          // 5. Sepia Warmth
          if (eff.sepia > 0.01) {
            const s = eff.sepia;
            const inv = 1 - s;
            for (let i = 0; i < out.length; i += 4) {
              const r = out[i], g = out[i + 1], b = out[i + 2];
              const sr = clamp(0.393 * r + 0.769 * g + 0.189 * b);
              const sg = clamp(0.349 * r + 0.686 * g + 0.168 * b);
              const sb = clamp(0.272 * r + 0.534 * g + 0.131 * b);
              out[i] = r * inv + sr * s;
              out[i + 1] = g * inv + sg * s;
              out[i + 2] = b * inv + sb * s;
            }
          }

          // 6. Contrast
          if (eff.contrast > 0.01) {
            const factor = (259 * (eff.contrast * 180 + 255)) / (255 * (259 - eff.contrast * 180));
            for (let i = 0; i < out.length; i += 4) {
              out[i] = clamp(factor * (out[i] - 128) + 128);
              out[i + 1] = clamp(factor * (out[i + 1] - 128) + 128);
              out[i + 2] = clamp(factor * (out[i + 2] - 128) + 128);
            }
          }

          // 7. Vignette
          if (eff.vignette > 0.01) {
            const v = eff.vignette;
            const cx = w / 2;
            const cy = h / 2;
            const maxDist = Math.hypot(cx, cy);
            for (let y = 0; y < h; y++) {
              const dy = y - cy;
              for (let x = 0; x < w; x++) {
                const dx = x - cx;
                const dist = Math.hypot(dx, dy) / maxDist;
                const vignetteFactor = 1 - Math.pow(dist, 1.8) * v * 0.85;
                const idx = (y * w + x) * 4;
                out[idx] = clamp(out[idx] * vignetteFactor);
                out[idx + 1] = clamp(out[idx + 1] * vignetteFactor);
                out[idx + 2] = clamp(out[idx + 2] * vignetteFactor);
              }
            }
          }

          // 8. Invert
          if (eff.invert > 0.01) {
            const invA = eff.invert;
            const keepA = 1 - invA;
            for (let i = 0; i < out.length; i += 4) {
              out[i] = out[i] * keepA + (255 - out[i]) * invA;
              out[i + 1] = out[i + 1] * keepA + (255 - out[i + 1]) * invA;
              out[i + 2] = out[i + 2] * keepA + (255 - out[i + 2]) * invA;
            }
          }

          // Apply Master Intensity Blend
          if (master < 0.999) {
            for (let i = 0; i < out.length; i += 4) {
              out[i] = src[i] + (out[i] - src[i]) * master;
              out[i + 1] = src[i + 1] + (out[i + 1] - src[i + 1]) * master;
              out[i + 2] = src[i + 2] + (out[i + 2] - src[i + 2]) * master;
            }
          }

          canvasCtx.putImageData(outputImg, 0, 0);
          isRendering = false;
        });
      }

      // Load Image with Center-Crop Fill (Crisp 100% Fill)
      function loadImage(src) {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          const imgW = img.naturalWidth;
          const imgH = img.naturalHeight;

          // Center-crop fill to perfectly cover display dimensions without stretching or letterboxing
          const scale = Math.max(canvasW / imgW, canvasH / imgH);
          const drawW = imgW * scale;
          const drawH = imgH * scale;
          const offsetX = (canvasW - drawW) / 2;
          const offsetY = (canvasH - drawH) / 2;

          canvasCtx.clearRect(0, 0, canvasW, canvasH);
          canvasCtx.imageSmoothingEnabled = true;
          canvasCtx.imageSmoothingQuality = "high";
          canvasCtx.drawImage(img, offsetX, offsetY, drawW, drawH);

          rawImageData = canvasCtx.getImageData(0, 0, canvasW, canvasH);
          applyPixelStack();
        };
        img.src = src;
      }

      // ROTARY KNOB 1: UPLOAD
      let uploadAngle = 0;
      function setupUploadKnob() {
        let isDragging = false;
        let startY = 0;
        let startAngle = 0;
        let hasMoved = false;

        uploadKnob.addEventListener("pointerdown", (event) => {
          isDragging = true;
          hasMoved = false;
          startY = event.clientY;
          startAngle = uploadAngle;
          uploadKnob.classList.add("is-dragging");
          uploadKnob.setPointerCapture(event.pointerId);
        });

        uploadKnob.addEventListener("pointermove", (event) => {
          if (!isDragging) return;
          const dy = startY - event.clientY;
          if (Math.abs(dy) > 4) hasMoved = true;
          uploadAngle = startAngle + dy * 1.5;
          uploadRing.style.transform = `rotate(${uploadAngle}deg)`;
        });

        const endDrag = (event) => {
          if (!isDragging) return;
          isDragging = false;
          uploadKnob.classList.remove("is-dragging");
          try {
            uploadKnob.releasePointerCapture(event.pointerId);
          } catch (_) {}

          if (!hasMoved) {
            imageInput.click();
          } else {
            presetIndex = (presetIndex + 1) % presetList.length;
            loadImage(presetList[presetIndex]);
          }
        };

        uploadKnob.addEventListener("pointerup", endDrag);
        uploadKnob.addEventListener("pointercancel", endDrag);

        uploadKnob.addEventListener("wheel", (event) => {
          event.preventDefault();
          uploadAngle += event.deltaY > 0 ? 30 : -30;
          uploadRing.style.transform = `rotate(${uploadAngle}deg)`;
          presetIndex = (presetIndex + 1) % presetList.length;
          loadImage(presetList[presetIndex]);
        }, { passive: false });
      }

      // ROTARY KNOB 2: INTENSITY
      function setIntensity(pct) {
        masterIntensity = Math.max(0, Math.min(100, Math.round(pct))) / 100;
        intensityKnob.setAttribute("aria-valuenow", String(Math.round(masterIntensity * 100)));
        intensityValue.textContent = `${Math.round(masterIntensity * 100)}%`;

        // Map 0..1 to -135deg .. +135deg
        const deg = -135 + masterIntensity * 270;
        intensityRing.style.transform = `rotate(${deg}deg)`;
        applyPixelStack();
      }

      function setupIntensityKnob() {
        let isDragging = false;
        let startY = 0;
        let startIntensity = 100;

        intensityKnob.addEventListener("pointerdown", (event) => {
          isDragging = true;
          startY = event.clientY;
          startIntensity = masterIntensity * 100;
          intensityKnob.classList.add("is-dragging");
          intensityKnob.setPointerCapture(event.pointerId);
        });

        intensityKnob.addEventListener("pointermove", (event) => {
          if (!isDragging) return;
          const dy = startY - event.clientY;
          setIntensity(startIntensity + dy * 0.75);
        });

        const endDrag = (event) => {
          if (!isDragging) return;
          isDragging = false;
          intensityKnob.classList.remove("is-dragging");
          try {
            intensityKnob.releasePointerCapture(event.pointerId);
          } catch (_) {}
        };

        intensityKnob.addEventListener("pointerup", endDrag);
        intensityKnob.addEventListener("pointercancel", endDrag);

        intensityKnob.addEventListener("wheel", (event) => {
          event.preventDefault();
          setIntensity(masterIntensity * 100 + (event.deltaY < 0 ? 5 : -5));
        }, { passive: false });

        intensityKnob.addEventListener("keydown", (event) => {
          let delta = 0;
          if (event.key === "ArrowUp" || event.key === "ArrowRight") delta = event.shiftKey ? 10 : 2;
          else if (event.key === "ArrowDown" || event.key === "ArrowLeft") delta = event.shiftKey ? -10 : -2;
          if (delta !== 0) {
            event.preventDefault();
            setIntensity(masterIntensity * 100 + delta);
          }
        });
      }

      // ROTARY KNOB 3: RESET
      function setupResetKnob() {
        let isDragging = false;
        let startY = 0;
        let currentAngle = 0;

        function triggerReset() {
          // Reset Master Intensity to 100%
          setIntensity(100);

          // Reset all 8 vertical sliders with spring transition
          sliderCols.forEach((col) => {
            const dot = col.querySelector(".slider-dot");
            const fill = col.querySelector(".v-slider-fill");
            const tooltip = col.querySelector(".slider-tooltip");
            const effectName = col.dataset.effect;
            const displayName = col.dataset.name;

            effectValues[effectName] = 0;
            col.setAttribute("aria-valuenow", "0");
            col.classList.remove("has-value");

            dot.style.transition = "bottom 280ms var(--md-sys-motion-spring-fast-spatial)";
            dot.style.bottom = "0px";
            fill.style.height = "0%";
            tooltip.textContent = `${displayName}: 0%`;

            setTimeout(() => {
              dot.style.transition = "";
            }, 300);
          });

          // Reset ring spin animation
          resetRing.style.transition = "transform 360ms var(--md-sys-motion-spring-fast-spatial)";
          resetRing.style.transform = "rotate(360deg)";
          setTimeout(() => {
            resetRing.style.transition = "none";
            resetRing.style.transform = "rotate(0deg)";
          }, 380);

          applyPixelStack();
        }

        resetKnob.addEventListener("pointerdown", (event) => {
          isDragging = true;
          startY = event.clientY;
          resetKnob.classList.add("is-dragging");
          resetKnob.setPointerCapture(event.pointerId);
        });

        resetKnob.addEventListener("pointermove", (event) => {
          if (!isDragging) return;
          const dy = startY - event.clientY;
          currentAngle = dy * 1.5;
          resetRing.style.transform = `rotate(${currentAngle}deg)`;
        });

        const endDrag = (event) => {
          if (!isDragging) return;
          isDragging = false;
          resetKnob.classList.remove("is-dragging");
          try {
            resetKnob.releasePointerCapture(event.pointerId);
          } catch (_) {}
          triggerReset();
        };

        resetKnob.addEventListener("pointerup", endDrag);
        resetKnob.addEventListener("pointercancel", endDrag);

        resetKnob.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            triggerReset();
          }
        });
      }

      // 8 VERTICAL INTERACTIVE SLIDERS
      sliderCols.forEach((col) => {
        const dot = col.querySelector(".slider-dot");
        const fill = col.querySelector(".v-slider-fill");
        const tooltip = col.querySelector(".slider-tooltip");
        const effectName = col.dataset.effect;
        const displayName = col.dataset.name;

        function setSliderVal(pct) {
          const clamped = Math.max(0, Math.min(100, Math.round(pct)));
          effectValues[effectName] = clamped / 100;
          col.setAttribute("aria-valuenow", String(clamped));

          if (clamped > 0) {
            col.classList.add("has-value");
          } else {
            col.classList.remove("has-value");
          }

          // Move dot vertically up
          const translateY = (clamped / 100) * maxTravel;
          dot.style.bottom = `${translateY}px`;
          fill.style.height = `${clamped}%`;
          tooltip.textContent = `${displayName}: ${clamped}%`;

          applyPixelStack();
        }

        let dragging = false;

        function updateFromPointer(clientY) {
          const rect = col.getBoundingClientRect();
          const bottomY = rect.bottom - 20; // resting center
          const deltaY = bottomY - clientY;
          const pct = (deltaY / maxTravel) * 100;
          setSliderVal(pct);
        }

        col.addEventListener("pointerdown", (event) => {
          dragging = true;
          col.classList.add("is-active");
          col.setPointerCapture(event.pointerId);
          updateFromPointer(event.clientY);
        });

        col.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          updateFromPointer(event.clientY);
        });

        const endDrag = (event) => {
          if (!dragging) return;
          dragging = false;
          col.classList.remove("is-active");
          try {
            col.releasePointerCapture(event.pointerId);
          } catch (_) {}
        };

        col.addEventListener("pointerup", endDrag);
        col.addEventListener("pointercancel", endDrag);

        col.addEventListener("dblclick", () => {
          setSliderVal(0);
        });

        col.addEventListener("keydown", (event) => {
          let delta = 0;
          if (event.key === "ArrowUp" || event.key === "ArrowRight") delta = event.shiftKey ? 10 : 2;
          else if (event.key === "ArrowDown" || event.key === "ArrowLeft") delta = event.shiftKey ? -10 : -2;
          else if (event.key === "PageUp") delta = 15;
          else if (event.key === "PageDown") delta = -15;
          else if (event.key === "Home") {
            setSliderVal(0);
            event.preventDefault();
            return;
          } else if (event.key === "End") {
            setSliderVal(100);
            event.preventDefault();
            return;
          }

          if (delta !== 0) {
            event.preventDefault();
            const currentPct = effectValues[effectName] * 100;
            setSliderVal(currentPct + delta);
          }
        });
      });

      // File Input Change
      imageInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file && file.type.startsWith("image/")) {
          if (loadedUrl) URL.revokeObjectURL(loadedUrl);
          loadedUrl = URL.createObjectURL(file);
          loadImage(loadedUrl);
        }
        event.target.value = "";
      });

      // Drag and Drop Image onto Screen Box
      screenBox.addEventListener("dragover", (event) => {
        event.preventDefault();
        screenBox.classList.add("drag-over");
      });

      screenBox.addEventListener("dragleave", () => {
        screenBox.classList.remove("drag-over");
      });

      screenBox.addEventListener("drop", (event) => {
        event.preventDefault();
        screenBox.classList.remove("drag-over");
        const file = event.dataTransfer?.files?.[0];
        if (file && file.type.startsWith("image/")) {
          if (loadedUrl) URL.revokeObjectURL(loadedUrl);
          loadedUrl = URL.createObjectURL(file);
          loadImage(loadedUrl);
        }
      });

      // Click Screen Box to Download Processed PNG
      screenBox.addEventListener("click", () => {
        if (pixelCanvas.width > 0) {
          const link = document.createElement("a");
          link.download = "pixel-studio-export.png";
          link.href = pixelCanvas.toDataURL("image/png");
          link.click();
        }
      });

      // Initialize
      setupUploadKnob();
      setupIntensityKnob();
      setupResetKnob();
      setIntensity(100);
      loadImage(sampleImagePath);
    </script>
  </body>
</html>
