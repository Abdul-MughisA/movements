<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hi</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #111;
        color: #fff;
        font-family: system-ui, sans-serif;
      }

      h1 {
        font-size: clamp(4rem, 20vw, 12rem);
        animation: flash 1s steps(2, start) infinite;
      }

      @keyframes flash {
        to {
          visibility: hidden;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>hi</h1>
    </main>
  </body>
</html>
