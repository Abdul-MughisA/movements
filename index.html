<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bring an image to life with a simple, adjustable movement preview."
    />
    <title>Movements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d1b20;
        background: #ffffff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;

        /* Material 3 Baseline Color Tokens */
        --md-sys-color-primary: #6750a4;
        --md-sys-color-on-primary: #ffffff;
        --md-sys-color-primary-container: #eaddff;
        --md-sys-color-on-primary-container: #21005d;
        --md-sys-color-secondary-container: #e8def8;
        --md-sys-color-on-secondary-container: #1d192b;
        --md-sys-color-surface: #fef7ff;
        --md-sys-color-on-surface: #1d1b20;
        --md-sys-color-surface-variant: #e7e0ec;
        --md-sys-color-on-surface-variant: #49454f;
        --md-sys-color-surface-container-high: #ece6f0;
        --md-sys-color-tonal-button: #ded7e8;
        --md-sys-color-stop-indicator: #4a4459;

        /* Material 3 Shape Tokens */
        --md-sys-shape-corner-small: 8px;
        --md-sys-shape-corner-large: 16px;
        --md-sys-shape-corner-extra-large: 28px;
        --md-sys-shape-corner-full: 9999px;

        /* Material 3 Motion Tokens */
        --md-sys-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
        --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
        --md-sys-motion-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
        --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
        --md-sys-motion-spring-fast-spatial: linear(
          0, 0.15199 10%, 0.41201 20%, 0.6383 30%, 0.79724 40%,
          0.89588 50%, 0.9516 60%, 0.98044 70%, 0.99397 80%, 0.99953 90%, 1.0013 100%
        );

        /* Elevation */
        --md-sys-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        background: #ffffff;
      }

      /* App Layout */
      .app-layout {
        display: grid;
        grid-template-columns: 352px 1fr;
        min-height: 100vh;
        width: 100%;
      }

      /* Sidebar */
      .sidebar {
        width: 352px;
        background: var(--md-sys-color-surface);
        padding: 52px 38px;
        display: flex;
        flex-direction: column;
        user-select: none;
      }

      /* Base Button with M3 State Layer & Shape Morph */
      button {
        font-family: inherit;
        border: none;
        outline: none;
        cursor: pointer;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          border-radius 180ms var(--md-sys-motion-spring-fast-spatial, cubic-bezier(0.2, 0, 0, 1)),
          background-color 150ms var(--md-sys-motion-easing-standard),
          box-shadow 150ms var(--md-sys-motion-easing-standard);
      }

      /* State Layer */
      button::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background-color: currentColor;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms linear;
      }

      button:hover::before {
        opacity: 0.08;
      }

      button:focus-visible::before {
        opacity: 0.10;
      }

      button:focus-visible {
        outline: 2px solid var(--md-sys-color-primary);
        outline-offset: 2px;
      }

      /* M3 Shape Morph on Press */
      button:active {
        border-radius: var(--button-pressed-radius, 8px) !important;
      }

      button:active::before {
        opacity: 0.12;
      }

      button > * {
        position: relative;
        z-index: 1;
      }

      /* Ripple ink animation */
      .ripple-ink {
        position: absolute;
        border-radius: 50%;
        background-color: currentColor;
        opacity: 0.16;
        pointer-events: none;
        transform: scale(0);
        animation: m3-ripple 450ms var(--md-sys-motion-easing-standard) forwards;
      }

      @keyframes m3-ripple {
        to {
          transform: scale(2.8);
          opacity: 0;
        }
      }

      /* Upload Button */
      .upload-button {
        width: 276px;
        height: 56px;
        border-radius: var(--md-sys-shape-corner-large);
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1px;
        gap: 10px;
        --button-pressed-radius: 8px;
      }

      .upload-button svg {
        width: 18px;
        height: 18px;
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      /* Material 3 Expressive Slider */
      .slider-container {
        margin-top: 42px;
        width: 276px;
        height: 44px;
        display: flex;
        align-items: center;
        position: relative;
      }

      .m3-slider {
        width: 100%;
        height: 44px;
        display: flex;
        align-items: center;
        position: relative;
        cursor: pointer;
        touch-action: none;
        outline: none;
      }

      .m3-slider:focus-visible {
        outline: 2px solid var(--md-sys-color-primary);
        outline-offset: 4px;
        border-radius: 12px;
      }

      .m3-slider-track-wrap {
        width: 100%;
        height: 16px;
        display: flex;
        align-items: center;
        position: relative;
      }

      .m3-slider-active-track {
        height: 16px;
        border-radius: 8px;
        background: var(--md-sys-color-primary);
        position: absolute;
        left: 0;
        top: 0;
      }

      .m3-slider-thumb {
        position: absolute;
        top: 50%;
        width: 4px;
        height: 42px;
        transform: translate(-50%, -50%);
        border-radius: 2px;
        background: var(--md-sys-color-primary);
        transition: width 150ms var(--md-sys-motion-easing-standard);
        z-index: 2;
      }

      .m3-slider:hover .m3-slider-thumb,
      .m3-slider.is-dragging .m3-slider-thumb {
        width: 6px;
      }

      .m3-slider-inactive-track {
        height: 16px;
        border-radius: 8px;
        background: var(--md-sys-color-secondary-container);
        position: absolute;
        right: 0;
        top: 0;
      }

      .m3-slider-stop-indicator {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--md-sys-color-stop-indicator);
        pointer-events: none;
      }

      /* Value Tooltip Badge */
      .m3-slider-value-badge {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%) translateY(4px);
        background: var(--md-sys-color-on-primary-container);
        color: var(--md-sys-color-on-primary);
        font-size: 12px;
        font-weight: 500;
        padding: 4px 8px;
        border-radius: 8px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition:
          opacity 140ms var(--md-sys-motion-easing-standard),
          transform 140ms var(--md-sys-motion-easing-standard);
      }

      .m3-slider:hover .m3-slider-value-badge,
      .m3-slider.is-dragging .m3-slider-value-badge {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Canvas / Preview Stage */
      .canvas-area {
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        min-height: 100vh;
        transition: background-color 180ms ease;
      }

      .canvas-area.drag-over {
        background-color: #faf6fd;
      }

      .canvas-area.drag-over::after {
        content: "";
        position: absolute;
        inset: 16px;
        border: 2px dashed var(--md-sys-color-primary);
        border-radius: 24px;
        pointer-events: none;
      }

      .image-container {
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1000px;
        max-width: min(85vw, 920px);
        max-height: min(80vh, 680px);
      }

      .image-container[hidden] {
        display: none;
      }

      .moving-image {
        display: block;
        max-width: 100%;
        max-height: min(78vh, 640px);
        object-fit: contain;
        border-radius: 20px;
        box-shadow: 0 16px 44px rgba(103, 80, 164, 0.12);
        cursor: pointer;
        user-select: none;
        transform: translateZ(0);
      }

      .moving-image.is-animating {
        animation: m3-drift 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }

      @keyframes m3-drift {
        0% {
          transform: translate3d(var(--distance-neg, -22px), -8px, 0) rotate(var(--tilt-neg, -2deg));
        }
        50% {
          transform: translate3d(0, 0, 0) rotate(0deg) scale(1.015);
        }
        100% {
          transform: translate3d(var(--distance, 22px), 8px, 0) rotate(var(--tilt, 2deg));
        }
      }

      /* Material 3 Dialog Centered in Canvas Area */
      dialog.m3-dialog {
        position: fixed;
        top: 50%;
        left: calc(352px + (100vw - 352px) / 2);
        transform: translate(-50%, -50%);
        margin: 0;
        width: 312px;
        padding: 24px;
        border: none;
        border-radius: var(--md-sys-shape-corner-extra-large);
        background: var(--md-sys-color-surface-container-high);
        box-shadow: var(--md-sys-elevation-3);
        color: var(--md-sys-color-on-surface);
        outline: none;
      }

      dialog.m3-dialog::backdrop {
        background: transparent;
      }

      dialog.m3-dialog[open] {
        animation: m3-dialog-enter 280ms var(--md-sys-motion-easing-emphasized-decelerate) forwards;
      }

      dialog.m3-dialog.is-closing {
        animation: m3-dialog-exit 180ms var(--md-sys-motion-easing-emphasized-accelerate) forwards;
      }

      @keyframes m3-dialog-enter {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.9);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }

      @keyframes m3-dialog-exit {
        from {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.92);
        }
      }

      .dialog-title {
        font-size: 24px;
        line-height: 28px;
        font-weight: 400;
        color: var(--md-sys-color-on-surface);
      }

      .dialog-copy {
        font-size: 14px;
        line-height: 20px;
        font-weight: 400;
        color: var(--md-sys-color-on-surface-variant);
        margin: 16px 0 24px 0;
      }

      .dialog-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      /* Dialog Buttons */
      .text-button {
        height: 40px;
        padding: 0 16px;
        border-radius: var(--md-sys-shape-corner-full);
        background: transparent;
        color: var(--md-sys-color-primary);
        font-size: 14px;
        font-weight: 500;
        --button-pressed-radius: 8px;
      }

      .tonal-button {
        height: 40px;
        padding: 0 20px;
        border-radius: var(--md-sys-shape-corner-full);
        background: var(--md-sys-color-tonal-button);
        color: var(--md-sys-color-primary);
        font-size: 14px;
        font-weight: 500;
        --button-pressed-radius: 8px;
      }

      /* Responsive Layout */
      @media (max-width: 720px) {
        .app-layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        .sidebar {
          width: 100%;
          padding: 24px 20px;
          align-items: center;
        }

        .upload-button,
        .slider-container {
          width: 100%;
          max-width: 320px;
        }

        dialog.m3-dialog {
          left: 50%;
        }
      }

      /* Reduced Motion Accessibility */
      @media (prefers-reduced-motion: reduce) {
        button,
        dialog.m3-dialog,
        .m3-slider-thumb,
        .moving-image {
          transition: none !important;
          animation: none !important;
        }

        .moving-image.is-animating {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" aria-label="Controls">
        <button class="upload-button" id="upload-button" type="button" aria-label="Upload">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11 16V7.85l-2.6 2.6L7 9l5-5 5 5-1.4 1.45-2.6-2.6V16h2ZM5 20q-.825 0-1.412-.587T3 18v-3h2v3h14v-3h2v3q0 .825-.587 1.413T19 20H5Z" />
          </svg>
          <span>Upload</span>
        </button>
        <input class="file-input" id="image-input" type="file" accept="image/*" aria-label="Choose image file" />

        <div class="slider-container">
          <div
            class="m3-slider"
            id="movement-slider"
            role="slider"
            tabindex="0"
            aria-label="Movement"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="50"
          >
            <div class="m3-slider-track-wrap" id="slider-track-wrap">
              <div class="m3-slider-active-track" id="slider-active-track"></div>
              <div class="m3-slider-thumb" id="slider-thumb">
                <div class="m3-slider-value-badge" id="slider-value-badge" aria-hidden="true">50%</div>
              </div>
              <div class="m3-slider-inactive-track" id="slider-inactive-track">
                <div class="m3-slider-stop-indicator"></div>
              </div>
            </div>
          </div>
        </div>
      </aside>

      <main class="canvas-area" id="canvas-area" aria-label="Image preview area">
        <div class="image-container" id="image-container" hidden>
          <img class="moving-image" id="preview-image" alt="Loaded image preview" />
        </div>
      </main>
    </div>

    <dialog class="m3-dialog" id="welcome-dialog" tabindex="-1" aria-labelledby="dialog-title" aria-describedby="dialog-copy">
      <h2 class="dialog-title" id="dialog-title">Hey!</h2>
      <p class="dialog-copy" id="dialog-copy">Do you want to proceed?</p>
      <div class="dialog-actions">
        <button class="text-button" id="cancel-button" type="button">
          <span>Cancel</span>
        </button>
        <button class="tonal-button" id="continue-button" type="button">
          <span>Let’s go!</span>
        </button>
      </div>
    </dialog>

    <script>
      const uploadButton = document.querySelector("#upload-button");
      const imageInput = document.querySelector("#image-input");
      const movementSlider = document.querySelector("#movement-slider");
      const sliderTrackWrap = document.querySelector("#slider-track-wrap");
      const sliderActiveTrack = document.querySelector("#slider-active-track");
      const sliderThumb = document.querySelector("#slider-thumb");
      const sliderInactiveTrack = document.querySelector("#slider-inactive-track");
      const sliderValueBadge = document.querySelector("#slider-value-badge");
      const canvasArea = document.querySelector("#canvas-area");
      const imageContainer = document.querySelector("#image-container");
      const previewImage = document.querySelector("#preview-image");
      const welcomeDialog = document.querySelector("#welcome-dialog");
      const cancelButton = document.querySelector("#cancel-button");
      const continueButton = document.querySelector("#continue-button");

      const sampleImagePath = "Assets/Movements%20Fri%2023%20Oct.png";
      let sliderValue = 50;
      let isDragging = false;
      let isPlaying = false;
      let loadedObjectUrl = null;

      // Material 3 Ripple implementation
      function attachRipple(button) {
        button.addEventListener("pointerdown", (event) => {
          const rect = button.getBoundingClientRect();
          const ripple = document.createElement("span");
          ripple.className = "ripple-ink";
          const size = Math.max(rect.width, rect.height) * 1.5;
          const x = event.clientX - rect.left - size / 2;
          const y = event.clientY - rect.top - size / 2;
          ripple.style.width = `${size}px`;
          ripple.style.height = `${size}px`;
          ripple.style.left = `${x}px`;
          ripple.style.top = `${y}px`;
          button.appendChild(ripple);

          const cleanup = () => {
            ripple.remove();
            window.removeEventListener("pointerup", cleanup);
            window.removeEventListener("pointercancel", cleanup);
          };
          window.addEventListener("pointerup", cleanup);
          window.addEventListener("pointercancel", cleanup);
        });
      }

      document.querySelectorAll("button").forEach(attachRipple);

      // Material 3 Expressive Slider
      function updateSlider(percent) {
        sliderValue = Math.max(0, Math.min(100, Math.round(percent)));
        movementSlider.setAttribute("aria-valuenow", String(sliderValue));
        sliderValueBadge.textContent = `${sliderValue}%`;

        const totalWidth = sliderTrackWrap.getBoundingClientRect().width || 276;
        const thumbX = (sliderValue / 100) * totalWidth;
        const gap = 6;
        const thumbHalf = 2;

        sliderThumb.style.left = `${thumbX}px`;

        const activeWidth = Math.max(0, thumbX - gap - thumbHalf);
        sliderActiveTrack.style.width = `${activeWidth}px`;

        const inactiveStart = Math.min(totalWidth, thumbX + gap + thumbHalf);
        const inactiveWidth = Math.max(0, totalWidth - inactiveStart);
        sliderInactiveTrack.style.width = `${inactiveWidth}px`;

        // Update animation values
        const intensity = sliderValue;
        const distance = Math.round(intensity * 0.44);
        const tilt = (intensity * 0.04).toFixed(1);
        previewImage.style.setProperty("--distance", `${distance}px`);
        previewImage.style.setProperty("--distance-neg", `-${distance}px`);
        previewImage.style.setProperty("--tilt", `${tilt}deg`);
        previewImage.style.setProperty("--tilt-neg", `-${tilt}deg`);
      }

      function handleSliderPointer(event) {
        const rect = sliderTrackWrap.getBoundingClientRect();
        const percent = ((event.clientX - rect.left) / rect.width) * 100;
        updateSlider(percent);
      }

      movementSlider.addEventListener("pointerdown", (event) => {
        isDragging = true;
        movementSlider.classList.add("is-dragging");
        movementSlider.setPointerCapture(event.pointerId);
        handleSliderPointer(event);
      });

      movementSlider.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        handleSliderPointer(event);
      });

      const endDragging = (event) => {
        if (!isDragging) return;
        isDragging = false;
        movementSlider.classList.remove("is-dragging");
        try {
          movementSlider.releasePointerCapture(event.pointerId);
        } catch (_) {}
      };

      movementSlider.addEventListener("pointerup", endDragging);
      movementSlider.addEventListener("pointercancel", endDragging);

      // Keyboard navigation for slider
      movementSlider.addEventListener("keydown", (event) => {
        let delta = 0;
        if (event.key === "ArrowRight" || event.key === "ArrowUp") delta = event.shiftKey ? 10 : 1;
        else if (event.key === "ArrowLeft" || event.key === "ArrowDown") delta = event.shiftKey ? -10 : -1;
        else if (event.key === "PageUp") delta = 10;
        else if (event.key === "PageDown") delta = -10;
        else if (event.key === "Home") {
          updateSlider(0);
          event.preventDefault();
          return;
        } else if (event.key === "End") {
          updateSlider(100);
          event.preventDefault();
          return;
        }

        if (delta !== 0) {
          event.preventDefault();
          updateSlider(sliderValue + delta);
        }
      });

      window.addEventListener("resize", () => updateSlider(sliderValue));

      // Image loading & playback
      function setImageSource(src) {
        previewImage.onload = () => {
          imageContainer.hidden = false;
          setPlaying(true);
        };
        previewImage.src = src;
      }

      function setPlaying(playing) {
        isPlaying = playing;
        previewImage.classList.toggle("is-animating", playing);
      }

      previewImage.addEventListener("click", () => {
        setPlaying(!isPlaying);
      });

      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" && event.target === document.body && !imageContainer.hidden) {
          event.preventDefault();
          setPlaying(!isPlaying);
        }
      });

      // Dialog Close with Material 3 Motion
      function closeDialog(callback) {
        welcomeDialog.classList.add("is-closing");
        const onEnd = () => {
          welcomeDialog.classList.remove("is-closing");
          welcomeDialog.close();
          welcomeDialog.removeEventListener("animationend", onEnd);
          if (callback) callback();
        };
        welcomeDialog.addEventListener("animationend", onEnd);
      }

      cancelButton.addEventListener("click", () => closeDialog());

      continueButton.addEventListener("click", () => {
        closeDialog(() => {
          setImageSource(sampleImagePath);
        });
      });

      // Upload button & File input
      uploadButton.addEventListener("click", () => imageInput.click());

      imageInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file && file.type.startsWith("image/")) {
          if (loadedObjectUrl) URL.revokeObjectURL(loadedObjectUrl);
          loadedObjectUrl = URL.createObjectURL(file);
          if (welcomeDialog.open) closeDialog();
          setImageSource(loadedObjectUrl);
        }
        event.target.value = "";
      });

      // Drag and drop onto canvas
      window.addEventListener("dragover", (event) => {
        event.preventDefault();
        canvasArea.classList.add("drag-over");
      });

      window.addEventListener("dragleave", (event) => {
        if (!event.relatedTarget || event.relatedTarget === document.documentElement) {
          canvasArea.classList.remove("drag-over");
        }
      });

      window.addEventListener("drop", (event) => {
        event.preventDefault();
        canvasArea.classList.remove("drag-over");
        const file = event.dataTransfer?.files?.[0];
        if (file && file.type.startsWith("image/")) {
          if (loadedObjectUrl) URL.revokeObjectURL(loadedObjectUrl);
          loadedObjectUrl = URL.createObjectURL(file);
          if (welcomeDialog.open) closeDialog();
          setImageSource(loadedObjectUrl);
        }
      });

      // Initial state
      updateSlider(50);
      welcomeDialog.showModal();
      welcomeDialog.focus({ preventScroll: true });
    </script>
  </body>
</html>
